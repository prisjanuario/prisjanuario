<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#B497D6" stroke-width="0.4" opacity="0.18"/>
    </pattern>

    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9B6FCE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9B6FCE" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="300" fill="url(#bg)"/>
  <rect width="1000" height="300" fill="url(#grid)"/>

  <!-- Pixel stars -->
  <g fill="#D8BFEB">
    <rect x="120" y="34" width="3" height="3"/>
    <rect x="250" y="20" width="3" height="3"/>
    <rect x="470" y="46" width="3" height="3"/>
    <rect x="780" y="200" width="3" height="3"/>
    <rect x="900" y="150" width="3" height="3"/>
    <rect x="60" y="220" width="3" height="3"/>
    <rect x="640" y="24" width="3" height="3"/>
  </g>

  <!-- Name -->
  <text x="100" y="105" font-size="58" font-weight="700" fill="#9B6FCE">
    Priscila Januario
  </text>

  <!-- Role -->
  <text x="100" y="140" font-size="19" fill="#E8E8E8" font-weight="400" letter-spacing="0.5">
    UI/UX Designer &amp; Front-End Developer
  </text>

  <!-- Pill tag -->
  <g transform="translate(100,160)">
    <rect x="0" y="0" width="200" height="34" rx="17" fill="none" stroke="#B497D6" stroke-width="1.5"/>
    <text x="100" y="22" font-size="14" fill="#D8BFEB" font-weight="600" letter-spacing="0.3" text-anchor="middle">
      E-commerce | SaaS | B2C
    </text>
  </g>

  <!-- Divider -->
  <line x1="100" y1="222" x2="900" y2="222" stroke="#B497D6" stroke-width="0.5" opacity="0.3"/>

  <!-- Tech stack -->
  <g font-size="14" fill="#CFCFCF" font-weight="500">
    <circle cx="100" cy="248" r="2" fill="#B497D6"/>
    <text x="112" y="252">Figma</text>
    <circle cx="232" cy="248" r="2" fill="#B497D6"/>
    <text x="244" y="252">HTML5</text>
    <circle cx="364" cy="248" r="2" fill="#B497D6"/>
    <text x="376" y="252">CSS3</text>
    <circle cx="489" cy="248" r="2" fill="#B497D6"/>
    <text x="501" y="252">JavaScript</text>
    <circle cx="656" cy="248" r="2" fill="#B497D6"/>
    <text x="668" y="252">React.js</text>
    <circle cx="809" cy="248" r="2" fill="#B497D6"/>
    <text x="821" y="252">Tailwind</text>
  </g>
</svg>
